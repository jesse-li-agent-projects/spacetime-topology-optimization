[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sttopt"
version = "0.1.0"
description = "Space-time topology optimization with an overheating-prevention constraint (Das et al., CMAME 2025) — Python port of conductivity_estimation_2d"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "jaxtyping",
]

[project.optional-dependencies]
test = ["pytest"]
# The PyTorch FEM solver (sttopt.torch_fem, sttopt.torch_mg) is an in-progress
# investigation gated on plans/archive/torch_port.md's benchmark, not yet on any production
# code path -- so torch stays optional and the core install keeps working without it.
torch = ["torch"]

[project.scripts]
sttopt = "sttopt.cli:main"

[tool.setuptools.packages.find]
include = ["sttopt*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-m", "not slow", "--ignore=proj_utils"]
norecursedirs = ["proj_utils"]
markers = [
    "slow: full-length optimization runs (minutes to hours). Deselected by default; run with `-m slow`.",
]
